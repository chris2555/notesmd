<!doctype html>
<html lang="es" data-theme="noche">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>notesmd</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.6 15.6 20 20"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.6" cy="6" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.6" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.6" cy="18" r="1.1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path class="pin-head" d="M9.1 3.6h5.8l-.8 4.8 2.9 3v1.7H7v-1.7l2.9-3-.8-4.8Z"/><path d="M12 13.1v7.3"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3.5" y="4.8" width="17" height="4.4" rx="1.2"/><path d="M5.3 9.2v9.2a1.6 1.6 0 0 0 1.6 1.6h10.2a1.6 1.6 0 0 0 1.6-1.6V9.2M9.8 13.2h4.4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7.2h16M9.2 7.2V5.4a1 1 0 0 1 1-1h3.6a1 1 0 0 1 1 1v1.8M6.4 7.2l.8 12.3h9.6l.8-12.3M10 11v5M14 11v5"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4.4 10.2a8 8 0 1 1 1.9 7.2M4.4 4.6v5.6h5.6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6.4 6.4 11.2 11.2M17.6 6.4 6.4 17.6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.6 7.4a2 2 0 0 1 2-2h3.8l2 2.4h7a2 2 0 0 1 2 2v6.8a2 2 0 0 1-2 2h-12.8a2 2 0 0 1-2-2V7.4Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.6 4.6L19 7.6"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M9.6 6.5c-2.9 1-4.4 3-4.4 5.7 0 1.8 1 3.1 2.6 3.1 1.4 0 2.4-1 2.4-2.4 0-1.3-.9-2.3-2.2-2.3-.2 0-.4 0-.6.1.3-1 1.2-1.9 2.7-2.5l-.5-1.7ZM18.4 6.5c-2.9 1-4.4 3-4.4 5.7 0 1.8 1 3.1 2.6 3.1 1.4 0 2.4-1 2.4-2.4 0-1.3-.9-2.3-2.2-2.3-.2 0-.4 0-.6.1.3-1 1.2-1.9 2.7-2.5l-.5-1.7Z"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8.7 7.2-5 4.8 5 4.8M15.3 7.2l5 4.8-5 4.8"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.2 13.8a3.6 3.6 0 0 0 5.1 0l2.6-2.6a3.6 3.6 0 0 0-5.1-5.1l-1.5 1.5"/><path d="M13.8 10.2a3.6 3.6 0 0 0-5.1 0l-2.6 2.6a3.6 3.6 0 0 0 5.1 5.1l1.5-1.5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.8 12s3.4-6 9.2-6 9.2 6 9.2 6-3.4 6-9.2 6-9.2-6-9.2-6Z"/><circle cx="12" cy="12" r="2.7"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m4.4 19.6 1-4.4L16.1 4.5a1.6 1.6 0 0 1 2.3 0l1.1 1.1a1.6 1.6 0 0 1 0 2.3L8.8 18.6l-4.4 1Z"/><path d="m14.8 5.8 3.4 3.4"/></symbol>
    <symbol id="i-ul" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.7" cy="6.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.7" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.7" cy="17.5" r="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-checkbox" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12.3 2.7 2.7 5.4-5.4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></symbol>
  </svg>

  <div class="app">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 3.2h9.4l5.1 5.1v12.5H5Z" fill="currentColor"/>
            <path d="M14.4 3.2v5.1h5.1" fill="none" stroke="#151810" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M8.6 12.2h6.8M8.6 15.6h4.6" stroke="#151810" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">notesmd<span class="brand-dot">.</span></span>
        <span class="demo-badge" id="demo-badge" hidden title="Vista de demostración: los cambios no se guardan en disco">demo</span>
      </div>

      <button class="new-note" id="new-note" type="button">
        <svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>
        <span>Nueva nota</span>
        <kbd>N</kbd>
      </button>

      <nav class="nav" aria-label="Vistas">
        <button class="nav-item is-active" data-view="all" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-grid"/></svg>
          <span class="nav-label">Todas las notas</span>
          <span class="count" data-count="all">0</span>
        </button>
        <button class="nav-item" data-view="archived" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-archive"/></svg>
          <span class="nav-label">Archivadas</span>
          <span class="count" data-count="archived">0</span>
        </button>
        <button class="nav-item" data-view="trash" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>
          <span class="nav-label">Papelera</span>
          <span class="count" data-count="trash">0</span>
        </button>
      </nav>

      <div class="labels-block">
        <p class="section-label">Etiquetas</p>
        <div class="labels" id="labels"></div>
      </div>

      <div class="rail-foot">
        <button class="rail-btn" id="open-folder" type="button" title="Abrir la carpeta de notas">
          <svg class="i" aria-hidden="true"><use href="#i-folder"/></svg>
          <span>Abrir carpeta</span>
        </button>
        <button class="rail-btn icon-only" id="theme-toggle" type="button" title="Cambiar tema" aria-label="Cambiar tema">
          <svg class="i" aria-hidden="true" id="theme-icon"><use href="#i-sun"/></svg>
        </button>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="view-head">
          <h1 id="view-title">Todas las notas</h1>
          <span class="view-count" id="view-count">0</span>
        </div>
        <div class="tools">
          <button class="danger-text" id="empty-trash" type="button" hidden>Vaciar papelera</button>
          <div class="search">
            <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
            <input id="search" type="search" placeholder="Buscar notas" autocomplete="off" spellcheck="false" aria-label="Buscar notas">
            <button class="search-clear" id="search-clear" type="button" aria-label="Limpiar búsqueda" hidden>
              <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
            </button>
            <kbd class="search-kbd">/</kbd>
          </div>
          <div class="sort-wrap">
            <select id="sort" aria-label="Ordenar notas">
              <option value="updated">Recientes</option>
              <option value="created">Creadas</option>
              <option value="title">Título</option>
            </select>
            <svg class="i" aria-hidden="true"><use href="#i-chevron"/></svg>
          </div>
          <div class="view-toggle" role="group" aria-label="Forma de ver las notas">
            <button data-view-mode="masonry" type="button" title="Mosaico" aria-label="Vista de mosaico" aria-pressed="true">
              <svg class="i" aria-hidden="true"><use href="#i-grid"/></svg>
            </button>
            <button data-view-mode="list" type="button" title="Lista" aria-label="Vista de lista" aria-pressed="false">
              <svg class="i" aria-hidden="true"><use href="#i-list"/></svg>
            </button>
          </div>
        </div>
      </header>

      <div class="board" id="board">
        <div class="board-inner">
          <button class="composer" id="composer" type="button">
            <span class="composer-plus" aria-hidden="true"><svg class="i"><use href="#i-plus"/></svg></span>
            <span class="composer-text">
              <span class="composer-title">Escribe una nota</span>
              <span class="composer-sub">Markdown, guardado solo en este equipo</span>
            </span>
            <kbd>N</kbd>
          </button>
          <div class="grid" id="grid"></div>
          <div class="empty" id="empty" hidden></div>
        </div>
      </div>
    </section>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="note-title">
      <header class="sheet-head">
        <input id="note-title" class="title-input" placeholder="Título" maxlength="300" autocomplete="off" spellcheck="false">
        <div class="sheet-actions">
          <button class="icon-btn" id="pin-toggle" type="button" title="Fijar nota" aria-label="Fijar nota" aria-pressed="false">
            <svg class="i" aria-hidden="true"><use href="#i-pin"/></svg>
          </button>
          <div class="color-wrap">
            <button class="icon-btn color-btn" id="color-btn" type="button" title="Color de la nota" aria-label="Color de la nota" aria-haspopup="true" aria-expanded="false">
              <span class="color-dot" id="color-dot"></span>
            </button>
            <div class="palette" id="palette" role="menu" aria-label="Colores" hidden></div>
          </div>
          <button class="icon-btn" id="close-editor" type="button" title="Cerrar (Esc)" aria-label="Cerrar">
            <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
          </button>
        </div>
      </header>

      <div class="tag-row">
        <div class="tag-editor" id="tag-editor">
          <input id="tag-input" type="text" list="tag-options" placeholder="Añadir etiqueta" maxlength="40" autocomplete="off" aria-label="Añadir etiqueta">
        </div>
      </div>

      <div class="format-bar" id="format-bar">
        <span class="preview-label">Vista previa</span>
        <button class="fmt-btn" type="button" data-md="bold" title="Negrita (Ctrl+B)"><b>B</b></button>
        <button class="fmt-btn" type="button" data-md="italic" title="Cursiva (Ctrl+I)"><i>I</i></button>
        <button class="fmt-btn fmt-text" type="button" data-md="heading" title="Título de sección">H2</button>
        <span class="fmt-sep" aria-hidden="true"></span>
        <button class="fmt-btn" type="button" data-md="list" title="Lista"><svg class="i" aria-hidden="true"><use href="#i-ul"/></svg></button>
        <button class="fmt-btn" type="button" data-md="task" title="Tarea"><svg class="i" aria-hidden="true"><use href="#i-checkbox"/></svg></button>
        <button class="fmt-btn" type="button" data-md="quote" title="Cita"><svg class="i" aria-hidden="true"><use href="#i-quote"/></svg></button>
        <button class="fmt-btn" type="button" data-md="code" title="Código"><svg class="i" aria-hidden="true"><use href="#i-code"/></svg></button>
        <button class="fmt-btn" type="button" data-md="link" title="Enlace"><svg class="i" aria-hidden="true"><use href="#i-link"/></svg></button>
        <span class="format-spacer"></span>
        <span class="markdown-hint">markdown</span>
        <button class="preview-toggle" id="preview-toggle" type="button" aria-pressed="false" title="Vista previa">
          <svg class="i" aria-hidden="true"><use href="#i-eye"/></svg>
          <span>Vista</span>
        </button>
      </div>

      <div class="editor-body" id="editor-body">
        <textarea id="note-body" placeholder="Escribe en Markdown…" spellcheck="true" aria-label="Contenido de la nota"></textarea>
        <div class="markdown-body" id="note-preview" hidden></div>
      </div>

      <footer class="sheet-foot">
        <div class="foot-left" id="foot-left">
          <button class="text-btn" id="archive-btn" type="button"><svg class="i" aria-hidden="true"><use href="#i-archive"/></svg><span>Archivar</span></button>
          <button class="text-btn danger" id="delete-btn" type="button"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg><span>Eliminar</span></button>
        </div>
        <div class="foot-right">
          <span class="save-status" id="save-status" role="status" aria-live="polite"><i aria-hidden="true"></i><span>Guardado</span></span>
          <span class="word-count" id="word-count"></span>
          <button class="done-btn" id="done-btn" type="button">Listo</button>
        </div>
      </footer>
      <datalist id="tag-options"></datalist>
    </div>
  </div>

  <div class="confirm-layer" id="confirm-layer" hidden>
    <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Eliminar nota</h2>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button class="ghost-btn" id="confirm-cancel" type="button">Cancelar</button>
        <button class="danger-btn" id="confirm-ok" type="button">Eliminar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/purify.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
